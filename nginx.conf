server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy intervals.icu API to avoid CORS.
    # The upstream host is held in a variable so nginx resolves it per-request
    # instead of at startup -- a startup lookup failure would abort the worker.
    location ~ ^/api/(.*)$ {
        resolver            127.0.0.11 valid=300s ipv6=off;
        resolver_timeout    5s;

        set $intervals      "intervals.icu";
        proxy_pass          https://$intervals/api/$1$is_args$args;
        proxy_ssl_server_name on;
        proxy_set_header    Host intervals.icu;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_hide_header   Access-Control-Allow-Origin;
        add_header          Access-Control-Allow-Origin * always;
        add_header          Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header          Access-Control-Allow-Methods "GET, POST, OPTIONS" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
